[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "midi-creator"
version = "0.1.0"
description = "An agent-friendly framework for synchronized, per-layer MIDI generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3.3,<2",
    "jsonschema>=4.23,<5",
    "mcp>=1.26,<2",
    "python-rtmidi>=1.5,<2",
    "pedalboard>=0.9.26,<1",
    "numpy>=2,<3",
]

[project.scripts]
midi-creator = "midi_creator.cli:main"
midi-studio = "midi_creator.studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/midi_creator"]

[tool.uv]
package = true
